version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/Frontend/manobhav-ui"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directory: "/Backend/manobhav-api"
    schedule:
      interval: "weekly"
    groups:
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"
