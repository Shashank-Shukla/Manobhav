name: Frontend Deploy

on:
  push:
    branches:
      - master
    paths:
      - "Frontend/manobhav-ui/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    environment: Production

    defaults:
      run:
        working-directory: Frontend/manobhav-ui
    env:
      VITE_PUBLIC_API_BASE_URL: ${{ vars.VITE_PUBLIC_API_BASE_URL || 'https://api.manobhav.co.in' }}
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'ap-south-2' }}
      S3_BUCKET: ${{ vars.S3_BUCKET || secrets.S3_BUCKET }}
      CF_DISTRIBUTION_ID: ${{ vars.CF_DISTRIBUTION_ID || secrets.CF_DISTRIBUTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/manobhav-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Validate public frontend environment
        shell: bash
        run: |
          required_vars=(
            VITE_PUBLIC_API_BASE_URL
          )

          missing=()
          for key in "${required_vars[@]}"; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required public frontend env vars: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload immutable assets
        run: |
          if [ -d dist/assets ]; then
            aws s3 cp dist/assets "s3://${S3_BUCKET}/assets" \
              --recursive \
              --cache-control "public,max-age=31536000,immutable"
          fi

      - name: Upload short-cache public files
        run: |
          aws s3 cp dist "s3://${S3_BUCKET}" \
            --recursive \
            --exclude "index.html" \
            --exclude "assets/*" \
            --cache-control "public,max-age=300,must-revalidate"

      - name: Upload no-cache index
        run: |
          aws s3 cp dist/index.html "s3://${S3_BUCKET}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CF_DISTRIBUTION_ID}" \
            --paths "/*"
