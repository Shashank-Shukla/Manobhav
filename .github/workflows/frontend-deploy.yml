name: Frontend Deploy

on:
  push:
    branches:
      - master
    paths:
      - "Frontend/manobhav-ui/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend/manobhav-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/manobhav-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload immutable assets
        run: |
          if [ -d dist/assets ]; then
            aws s3 cp dist/assets "s3://${{ secrets.S3_BUCKET }}/assets" \
              --recursive \
              --cache-control "public,max-age=31536000,immutable"
          fi

      - name: Upload short-cache public files
        run: |
          aws s3 cp dist "s3://${{ secrets.S3_BUCKET }}" \
            --recursive \
            --exclude "index.html" \
            --exclude "assets/*" \
            --cache-control "public,max-age=300,must-revalidate"

      - name: Upload no-cache index
        run: |
          aws s3 cp dist/index.html "s3://${{ secrets.S3_BUCKET }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CF_DISTRIBUTION_ID }}" \
            --paths "/*"
