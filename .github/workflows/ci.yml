name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - admin-dashboard-operational-mvp

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/manobhav-api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ManobhavAPI.slnx

      - name: Build
        run: dotnet build ManobhavAPI.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ManobhavAPI.slnx --configuration Release --no-build

      - name: NuGet vulnerability audit
        run: dotnet list ManobhavAPI.slnx package --vulnerable --include-transitive

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/manobhav-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/manobhav-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: npm vulnerability audit
        run: npm audit --audit-level=high
